name: Forge
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Forge:
    type: application
    platform: iOS
    sources: [Forge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.forge
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Forge
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Forge uses the camera only when you take a progress photo. Photos stay on this device."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Forge uses Face ID to keep your photos, measurements and journal private."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Forge can save exported progress photos to your photo library when you choose to."
